name: stronger_muscles_dashboard
description: "A new Flutter project."

publish_to: 'none' # Remove this line if you wish to publish to pub.dev


version: 1.0.0+1

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter


  cupertino_icons: ^1.0.8

  get: ^4.6.6
  provider: ^6.0.0

  # Charts and Graphs
  fl_chart: ^1.1.1

  # UI Enhancements
  google_fonts: ^8.0.0
  intl: ^0.20.2

  # Network
  dio: ^5.4.0
  retrofit: ^4.1.0
  json_annotation: ^4.9.0
  http: ^1.2.2

  # Storage
  get_storage: ^2.1.1
  hive_flutter: ^1.1.0
  hive: ^2.2.3

  # JSON Serialization
  # Moved to dev_dependencies

  # Date/Time
  intl_utils: ^2.8.5
  image_picker: ^1.2.1
  cached_network_image: ^3.4.1
  internet_connection_checker_plus: ^2.9.1+2
  icons_launcher: ^3.0.3
  freezed_annotation: ^2.4.4
  particles_network: ^1.9.0
  flutter_staggered_animations: ^1.1.1
  chopper: ^8.5.0
  swagger_parser: ^1.43.0
  carapacik_lints: ^3.11.0
  json_serializable: ^6.8.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.13
  hive_generator: ^2.0.1
  freezed: ^2.5.2
  swagger_dart_code_generator: ^3.0.1
  chopper_generator: ^8.0.3


flutter:


  uses-material-design: true
  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/icons/
  #   - images/a_dot_ham.jpeg

  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
flutter_intl:
  enabled: true

icons_launcher:
  image_path: "assets/icons/applogo.png"
  platforms:
    android:
      enable: true
    ios:
      enable: true
    linux:
      enable: true