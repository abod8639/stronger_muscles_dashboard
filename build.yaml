targets:
  $default:
    sources:
      - lib/**
      - swagger/**
    builders:
      swagger_dart_code_generator|swagger_dart_code_generator:
        enabled: true
        options:
          input_folder: "swagger/"
          output_folder: "lib/generated/api/"
          with_base_url: true
          with_converter: true
          use_required_attribute_for_headers: false
          ignore_headers: false
          use_default_null_for_lists: false
          generate_first_succeed_response: true
          enums_case_sensitive: false
          build_only_models: false
          separate_models: false
          input_urls: []
